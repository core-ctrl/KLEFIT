apiVersion: apps/v1
kind: Deployment
metadata:
  name: efit-frontend
  labels:
    app: efit-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: efit-frontend
  template:
    metadata:
      labels:
        app: efit-frontend
    spec:
      containers:
      - name: efit-frontend
        image: efit-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: efit-frontend-service
spec:
  type: ClusterIP
  selector:
    app: efit-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
